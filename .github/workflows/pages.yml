# Publishes the installable web app (PWA) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Web-App (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never publish a version whose tests fail.
      - run: npm test
      - run: npm run build
        env:
          # Device sync server (sync-server/README.md). Unset = no sync in the web app.
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
