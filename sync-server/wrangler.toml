# Genlab sync server (Cloudflare Worker + D1). Setup: see README.md in this folder.
name = "genlab-sync"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "genlab-sync"
# Replace with the id printed by `npx wrangler d1 create genlab-sync`.
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
# Daily cleanup of saves nobody has synced for a year.
crons = ["17 3 * * *"]

# Rate limits per client IP (Workers rate limiting binding; period must be 10 or 60 seconds).
# All requests: a playing device syncs at most every few seconds.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# New saves (`baseRev: 0`) cost a database row: only a handful per minute.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Optional: only these browser origins may call the API (comma list). Unset = every origin.
# [vars]
# ALLOWED_ORIGINS = "https://arrows94.github.io,https://localhost,capacitor://localhost,tauri://localhost,http://tauri.localhost"
